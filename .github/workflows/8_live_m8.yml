name: "8. LIVE M8 — M6 + chase guard (paper-only)"

on:
  workflow_dispatch:          # also driven by cron-job.org every 15 min (scheduler-proof)
  schedule:
    # backup ticker only: 09:15–15:30 IST (03:45–10:00 UTC), weekdays
    - cron: "45-59/15 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0/15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: live-paper-m8
  cancel-in-progress: false   # never cancel mid-trade-cycle; queue instead

jobs:
  live-m8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DHAN_TOKEN: ${{ secrets.DHAN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u m8_runner.py --loop 1
      - name: commit state + reports
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "m8cycle $(date -u +%F_%H%M)Z"
          bash workflow_safe_push.sh
