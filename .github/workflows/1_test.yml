name: "1. TEST — connectivity & engine"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DHAN_TOKEN: ${{ secrets.DHAN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: unit tests (offline, no secrets needed)
        run: |
          for t in test_master_scanner.py test_trader.py test_telegram_bot.py \
                   test_fast_feed.py test_m15_runner.py test_m15_data_feed.py \
                   test_m6_runner.py; do
            echo "=== $t"; python -u "$t" || exit 1
          done
      - run: python -u live_runner.py --test
