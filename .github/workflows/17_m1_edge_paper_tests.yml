name: "17. TEST — M1E paper second-book alerts"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "m1_edge/**"
      - "test_m1_edge.py"
      - ".github/workflows/17_m1_edge_paper_tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # No `ref:` override: this checks out the branch/ref under test.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: M1E offline model tests
        run: |
          python -u test_m1_edge.py
          python -m compileall -q m1_edge
      - name: M1E distinct bot-3 card smoke test
        env:
          M1E_ENABLED: "1"
          M1E_MODE: "paper"
          M1E_STATE_PATH: /tmp/m1e_ci_state.json
          M1E_JOURNAL_DIR: /tmp/m1e_ci_journal
        run: |
          python - <<'PY' > /tmp/m1e_ci_payloads.jsonl
          import json
          base = {
              "session": "2026-11-25", "pick": "WAIT", "market": "BULL",
              "sectors": {"FMCG": {
                  "bull": 95.0, "bear": 2.0, "side": 1,
                  "gate": 1, "qualified": 1, "day": 2.0, "intra": 1.0,
                  "n": ["HINDUNILVR", "DABUR"],
                  "rank": [80.0, 70.0], "rk": [1, 2],
                  "mv": [2.0, 1.5], "s": [90, 80], "t": [90, 80],
              }},
          }
          p1 = dict(base, b="09:35")
          p2 = dict(base, b="15:10")
          p2["sectors"]["FMCG"]["mv"] = [3.0, 2.5]
          print(json.dumps(p1))
          print(json.dumps(p2))
          PY
          python -m m1_edge.runner --board-jsonl /tmp/m1e_ci_payloads.jsonl \
            --session 2026-11-25 --final --print-alerts
      - name: Verify the integration patch is well formed
        run: |
          git apply --numstat m1_edge/integration/persist-check-1m-second-book.patch
