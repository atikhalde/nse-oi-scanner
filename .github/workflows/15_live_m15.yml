name: "15. LIVE M15 — range reclaim (paper only)"
on:
  workflow_dispatch:
  schedule:
    - cron: "45-59/15 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0/15 10 * * 1-5"
permissions:
  contents: write
concurrency:
  group: live-paper-m15
  cancel-in-progress: false
jobs:
  live-m15:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DHAN_TOKEN: ${{ secrets.DHAN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0de40-nse-oi-scanner
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_m15_entry.py
      - run: python -u m15_runner.py --loop 1
      - name: commit paper state and report
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -- state15.json
          find . -maxdepth 1 -name 'paper_test_M15_*.xlsx' -print0 | xargs -0 -r git add --
          find learn -maxdepth 1 -name 'raw_M15_*.csv' -print0 | xargs -0 -r git add --
          git diff --cached --quiet || git commit -m "m15cycle $(date -u +%F_%H%M)Z"
          git pull --rebase origin arena/01a0de40-nse-oi-scanner
          git push origin arena/01a0de40-nse-oi-scanner
