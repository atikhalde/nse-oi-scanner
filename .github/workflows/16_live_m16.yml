name: "16. LIVE M16 — pullback BOS continuation (alerts-only)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "session / once / dry-run / dedicated bot self-test"
        type: choice
        default: session
        options: [session, once, dry-run, test-alert]
  workflow_run:
    workflows: ["15. LIVE M15 — PERSIST+MASTER 5m (paper-only)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30,45,55 3 * * 1-5" # prewarm history/dependencies before 09:15 IST
    - cron: "*/15 4-9 * * 1-5"
    - cron: "5 10 * * 1-5" # 15:35 IST: retry failed EOD document delivery

permissions:
  contents: write
  actions: write

concurrency:
  group: live-m16-continuation
  cancel-in-progress: false

jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      M16_BOT_TOKEN: ${{ secrets.M16_BOT_TOKEN }}
      M16_CHAT_ID: ${{ secrets.M16_CHAT_ID }}
      M16_BOT_TOKEN_2: ${{ secrets.M16_BOT_TOKEN_2 }}
      M16_CHAT_ID_2: ${{ secrets.M16_CHAT_ID_2 }}
      M16_POLL_SECONDS: "1"
      M16_ENGINE_WORKERS: "4"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20
      - name: Check regular NSE session before installing or starting scanner
        id: market
        run: python3 m16_calendar.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.market.outputs.regular_session == 'true' || inputs.mode == 'test-alert'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.market.outputs.regular_session == 'true' || inputs.mode == 'test-alert'
      - name: M16 offline regressions
        if: steps.market.outputs.regular_session == 'true' || inputs.mode == 'test-alert'
        run: python -m unittest -v test_m16_calendar test_m16_feed test_m16_runner test_m16_audit
      - name: M16 dedicated session
        if: steps.market.outputs.regular_session == 'true' || inputs.mode == 'test-alert'
        env:
          MODE: ${{ inputs.mode || 'session' }}
        run: |
          case "$MODE" in
            test-alert) python -u m16_runner.py --test-alert ;;
            dry-run) python -u m16_runner.py --once --dry-run ;;
            once) python -u m16_runner.py --once ;;
            *) python -u m16_runner.py --session --max-runtime-min 324 ;;
          esac
      - name: Preserve M16 state and review
        if: always()
        run: |
          git config user.name paper-bot
          git config user.email paper-bot@users.noreply.github.com
          for f in state16.json activity_M16_*.txt audit_M16_*.pdf; do
            [ ! -e "$f" ] || git add -- "$f"
          done
          git diff --cached --quiet || git commit -m "m16cycle $(date -u +%F_%H%M)Z"
          bash workflow_safe_push.sh

      - name: Hand off full-day observation if first shift ended early
        if: success() && steps.market.outputs.regular_session == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'session' }}
        run: |
          IST=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M) + 330)); IST=$((IST % 1440))
          if [ "$MODE" = "session" ] && [ "$IST" -ge 555 ] && [ "$IST" -lt 931 ]; then
            gh workflow run 16_live_m16.yml -f mode=session
          fi
