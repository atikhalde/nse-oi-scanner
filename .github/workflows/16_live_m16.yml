name: "16. LIVE M16 — pullback BOS continuation (alerts-only)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "session / once / dry-run / dedicated bot self-test / feed-probe / sector-probe / readiness-check"
        type: choice
        default: session
        options: [session, once, dry-run, test-alert, app-link-probe, feed-probe, sector-probe, readiness-check]
      manual_recovery:
        description: "Operator recovery override (bypasses automatic restart cap)"
        type: boolean
        default: false
      automatic_handoff:
        description: "Automatic continuation handoff"
        type: boolean
        default: false
  schedule:
    - cron: "25 3 * * 1-5" # 08:55 IST supervised session start (pre-open buffer)
    - cron: "5 10 * * 1-5" # 15:35 IST: retry failed EOD document delivery

permissions:
  contents: write
  actions: write

# Keep the active session alive when external cron-job.org keep-alives fire
# every 15 minutes (matching M2/M5/M6/M15). Dry-runs and probes have their own
# concurrency groups so they can run anytime without waiting on the live session.
concurrency:
  group: live-m16-${{ github.ref }}-${{ inputs.mode || 'session' }}
  cancel-in-progress: false

jobs:
  continuation:
    runs-on: ubuntu-latest
    # Cover 08:55 -> ~14:20 IST in one uninterrupted shift (well past the 12:30
    # entry cutoff), then hand off once through 15:31 IST EOD report delivery.
    timeout-minutes: 350
    env:
      M16_BOT_TOKEN: ${{ secrets.M16_BOT_TOKEN }}
      M16_CHAT_ID: ${{ secrets.M16_CHAT_ID }}
      M16_BOT_TOKEN_2: ${{ secrets.M16_BOT_TOKEN_2 }}
      M16_CHAT_ID_2: ${{ secrets.M16_CHAT_ID_2 }}
      M16_POLL_SECONDS: "1"
      M16_YAHOO_COORDINATE: "1"
      # 5 starts/s. With discovery sliced in three (below) a bucket is ~136
      # symbols (210 F&O + 196 extra-universe, 406 total) + ~62 basket members +
      # 32 index series (~230 requests, ~46s), still far below the 10/s burst that
      # tripped Yahoo's 429 cooldown on 26-Nov (1201 of 2667 requests). If 429s
      # return, raise this to 0.25 or trim m16_extra_universe.csv; do not raise
      # M16_DISCOVERY_SLICES past 3 (a slower revisit breaks the 15-min late window).
      M16_YAHOO_REQUEST_INTERVAL: "0.20"
      M16_ENGINE_WORKERS: "4"
      M16_SECTOR_WORKERS: "2"
      # Universe discovery rotates over three slices (every symbol revisited
      # every 15 min, inside the delayed-alert window) and a bucket's wave
      # stays queued while the sector board refresh is in flight (25s cap), so
      # the board always gets the provider budget first.
      M16_DISCOVERY_SLICES: "3"
      M16_SECTOR_RUNWAY_SECONDS: "25"
      # Advisory mode has nothing to wait for: the board only gets a short
      # courtesy window (8s) instead of holding the discovery wave for 25s.
      M16_SECTOR_RUNWAY_ADVISORY_SECONDS: "8"
      # A close alert may wait for its own gate: the wait (capped here) is
      # credited back to the 30s freshness window instead of turning the alert
      # into a "found late" one, and the price still has to be within 0.75% of
      # the BOS once the wait pushed it past 30s.
      M16_BOARD_WAIT_SECONDS: "60"
      # Sector policy: advisory (default) delivers EVERY fresh signal and prints
      # the board as context - score, 15-minute slope, rank, breadth, plus a
      # warning when the score is falling. Set "gate" to restore the strict
      # fail-closed board (score >70 and top-3 rank, waiting for publication):
      # on 27-Nov that gate passed 10 of the day's worst breakouts and blocked
      # 10 of the best (BAJAJ-AUTO +2.04%, ANGELONE, ABCAPITAL, GODFRYPHLP,
      # ETERNAL, GAIL, AXISBANK, BAJAJFINSV, LICI, SBIN).
      M16_SECTOR_MODE: "advisory"
      # One alert per symbol/side/candle: when a running alert was delivered,
      # its close confirmation is recorded (duplicate_suppressed) not re-sent.
      # Set "0" to keep both messages.
      M16_SUPPRESS_DUPLICATES: "1"
      # A pullback may close this far through EMA9/EMA10 without killing the
      # seed (the entry candle itself still has to hold them strictly). 358
      # seeds died on EMA noise in four sessions, 95% of them within 0.30%.
      M16_EMA_TOLERANCE_PCT: "0.30"
      # Scan the 196 major non-F&O names in m16_extra_universe.csv (GRSE, PARAS,
      # THERMAX, IRCTC, NAVINFLUOR, JKCEMENT, ABBOTINDIA, SUNTV, KPRMILL, ...) for
      # STOCK alerts only. Names are polled from the session after workflow
      # 2. Bootstrap writes their history. Sector baskets and every sector score
      # are untouched; set "0" to scan the F&O map alone.
      M16_EXTRA_UNIVERSE: "1"
      # Delayed re-entry policy: a close-confirmed BOS found up to 15 min late
      # still alerts (priced at discovery, labelled DELAYED) while price is
      # within 0.75% of the frozen BOS.
      M16_LATE_ALERTS: "1"
      M16_LATE_WINDOW_MIN: "15"
      M16_LATE_MAX_EXTENSION_PCT: "0.75"
      M16_UNHEALTHY_EXIT_SECONDS: "300"
      M16_MAX_SESSION_STARTS: "16"
      M16_AUTOMATIC_SESSION: ${{ inputs.manual_recovery && '0' || '1' }}
      M16_DRY_RUN_SYMBOLS: "3"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 20
      - name: Check regular NSE session and active window before installing or starting scanner
        id: market
        env:
          MODE: ${{ inputs.mode || 'session' }}
        run: |
          python3 m16_calendar.py >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          from pathlib import Path
          import m16_calendar as cal
          mode = os.environ.get("MODE", "session")
          if mode in {"dry-run", "test-alert", "app-link-probe", "feed-probe", "sector-probe", "readiness-check"}:
              print("should_run=true")
              raise SystemExit(0)
          now = datetime.datetime.now(cal.IST)
          status, reason = cal.session_status(now)
          hhmm = now.strftime("%H:%M")
          if status == "closed" or now.weekday() >= 5 or hhmm < "08:55" or hhmm >= "15:40":
              print("should_run=false")
              raise SystemExit(0)
          today = now.strftime("%Y-%m-%d")
          state_path = Path("state16.json")
          if state_path.exists():
              try:
                  st = json.loads(state_path.read_text(encoding="utf-8"))
              except Exception:
                  st = {}
              if isinstance(st, dict) and st.get("date") == today:
                  if st.get("eod_done"):
                      print("should_run=false")
                      raise SystemExit(0)
                  auto = os.environ.get("M16_AUTOMATIC_SESSION", "1") != "0"
                  cap = max(1, int(os.environ.get("M16_MAX_SESSION_STARTS", "12")))
                  used = int(st.get("automatic_session_starts", st.get("session_starts", 0)))
                  if mode == "session" and auto and used >= cap:
                      print("should_run=false")
                      raise SystemExit(0)
          print("should_run=true")
          PY
      - uses: actions/setup-python@v6
        if: steps.market.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.market.outputs.should_run == 'true'
      - name: M16 offline regressions
        id: regressions
        if: steps.market.outputs.should_run == 'true'
        env:
          M16_BOT_TOKEN: ""
          M16_CHAT_ID: ""
          M16_BOT_TOKEN_2: ""
          M16_CHAT_ID_2: ""
        run: |
          TEST_ROOT=$(mktemp -d)
          trap 'rm -rf "$TEST_ROOT"' EXIT
          # Regression fixtures must never overwrite the live checkout state.
          git archive HEAD | tar -x -C "$TEST_ROOT"
          cd "$TEST_ROOT"
          M16_YAHOO_COORDINATE=0 python -m unittest -v test_m16_transport test_m16_sector test_m16_rally test_m16_calendar test_m16_feed test_m16_runner test_m16_audit
      - name: M16 dedicated session
        if: steps.market.outputs.should_run == 'true'
        env:
          MODE: ${{ inputs.mode || 'session' }}
        run: |
          case "$MODE" in
            readiness-check) python -u m16_runner.py --readiness-check ;;
            test-alert) python -u m16_runner.py --test-alert ;;
            app-link-probe) python -u m16_runner.py --probe-app-links ;;
            feed-probe) python -u m16_runner.py --feed-probe ;;
            sector-probe) python -u m16_runner.py --sector-probe ;;
            dry-run) python -u m16_runner.py --once --dry-run ;;
            once) python -u m16_runner.py --once ;;
            *) python -u m16_runner.py --session --max-runtime-min 325 ;;
          esac
      - name: Upload M16 diagnostic snapshot even after failure
        if: always() && steps.market.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: m16-diagnostics-${{ github.run_id }}
          path: |
            state16.json
            activity_M16_*.txt
            audit_M16_*.pdf
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve M16 state and review
        if: always() && steps.market.outputs.should_run == 'true' && inputs.mode != 'dry-run' && inputs.mode != 'test-alert' && inputs.mode != 'app-link-probe' && inputs.mode != 'feed-probe' && inputs.mode != 'sector-probe' && inputs.mode != 'readiness-check'
        run: |
          git config user.name paper-bot
          git config user.email paper-bot@users.noreply.github.com
          for f in state16.json activity_M16_*.txt audit_M16_*.pdf; do
            [ ! -e "$f" ] || git add -- "$f"
          done
          git diff --cached --quiet || git commit -m "m16cycle $(date -u +%F_%H%M)Z"
          bash workflow_safe_push.sh

      - name: Hand off supervised shift until EOD review completes
        if: always() && !cancelled() && steps.market.outputs.should_run == 'true' && steps.regressions.outcome == 'success' && steps.market.outputs.regular_session == 'true' && inputs.mode != 'dry-run' && inputs.mode != 'test-alert' && inputs.mode != 'app-link-probe' && inputs.mode != 'feed-probe' && inputs.mode != 'sector-probe' && inputs.mode != 'readiness-check'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'session' }}
        run: |
          IST=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M) + 330)); IST=$((IST % 1440))
          if [ "$MODE" = "session" ] && [ "$IST" -ge 555 ] && [ "$IST" -lt 938 ]; then
            read -r STARTS DONE < <(python3 - <<'PY'
          import datetime, json
          import m16_calendar as cal
          today = datetime.datetime.now(cal.IST).strftime('%Y-%m-%d')
          try:
              state = json.load(open('state16.json'))
              starts = int(state.get('automatic_session_starts', state.get('session_starts', 0)))
              done = 1 if state.get('date') == today and state.get('eod_done') else 0
              print(starts, done)
          except Exception:
              print(0, 0)
          PY
            )
            if [ "$DONE" = "1" ]; then
              echo "M16 EOD TXT + PDF review already completed for today; no handoff needed"
            elif [ "$STARTS" -lt "${M16_MAX_SESSION_STARTS:-16}" ]; then
              if [ -f .m16-unhealthy ]; then
                echo "M16 unhealthy watchdog requested a fresh supervised runner ($STARTS/${M16_MAX_SESSION_STARTS:-16} starts)"
              else
                echo "M16 shift complete; handing off to the next supervised session ($STARTS/${M16_MAX_SESSION_STARTS:-16} starts)"
              fi
              gh workflow run 16_live_m16.yml --ref main -f mode=session -f automatic_handoff=true
            else
              echo "M16 automatic restart cap reached; manual session remains available; not dispatching another loop"
            fi
          fi
