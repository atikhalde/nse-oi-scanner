name: "11. LIVE M11 — master × video-4 alignment (paper-only)"

on:
  workflow_dispatch:          # also driven by cron-job.org every 15 min (scheduler-proof)
    inputs:
      mode:
        description: "'live' = normal paper-trading cycle (default) · 'test-alert' = send sample M11 alert to all chats"
        required: true
        default: "live"
  schedule:
    # backup ticker only: 09:15–15:30 IST (03:45–10:00 UTC), weekdays
    - cron: "45-59/15 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0/15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: live-paper-m11
  cancel-in-progress: false   # never cancel mid-trade-cycle; queue instead

jobs:
  live-m11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DHAN_TOKEN: ${{ secrets.DHAN_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # M11-only: 2 extra telegram bots (optional — absent => main chat only)
      M11_BOT_TOKEN_A: ${{ secrets.M11_BOT_TOKEN_A }}
      M11_CHAT_ID_A: ${{ secrets.M11_CHAT_ID_A }}
      M11_BOT_TOKEN_B: ${{ secrets.M11_BOT_TOKEN_B }}
      M11_CHAT_ID_B: ${{ secrets.M11_CHAT_ID_B }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: test alert fanout (manual, mode=test-alert)
        if: github.event.inputs.mode == 'test-alert'
        run: python -u m11_runner.py --test-alert
      - name: live cycle (default)
        if: github.event.inputs.mode != 'test-alert'
        run: python -u m11_runner.py --loop 1
      - name: commit state + reports
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "m11cycle $(date -u +%F_%H%M)Z"
          bash workflow_safe_push.sh
