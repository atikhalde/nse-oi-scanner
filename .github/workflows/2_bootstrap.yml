name: "2. Bootstrap — daily history download"

on:
  workflow_dispatch:          # run once manually after pushing, then it self-schedules
  schedule:
    - cron: "15 3 * * 1-5"    # 08:45 IST weekdays, before market open

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DHAN_TOKEN: ${{ secrets.DHAN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u live_runner.py --bootstrap refresh-60d
      - run: python -u m9_bootstrap.py || echo "m9 bootstrap failed (non-fatal)"   # M9 cash data-farm history9 (~1,050 syms)
      - run: python -u label_learn.py   # Phase-0 Learning Log labeler (ML dataset build-up)
      - name: commit data
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/ learn/
          git commit -m "bootstrap $(date -u +%F_%H%M)Z" || echo "nothing to commit"
          git push
